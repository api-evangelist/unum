apis:
- aid: unum:benefits-enrollment
  name: Unum Benefits Enrollment API
  description: >-
    The Unum Benefits Enrollment API allows benefits administration platforms and HR systems to submit,
    update, and manage employee benefit enrollments in real time. The API enables seamless data synchronization
    between employer HR systems and Unum's benefits administration, supporting life events, open enrollment,
    and real-time quoting for voluntary benefits.
  humanURL: https://developer.unum.com/s/
  baseURL: https://api.unum.com
  tags:
  - Benefits Enrollment
  - Insurance
  - Voluntary Benefits
  properties:
  - type: Documentation
    url: https://developer.unum.com/s/
  - type: Website
    url: https://www.unum.com/employers/solutions/myunum
- aid: unum:leave-absence
  name: Unum Leave and Absence Management API
  description: >-
    The Unum Leave and Absence Management API integrates Unum's leave solutions directly with HCM platforms,
    automating leave request intake, status tracking, return-to-work coordination, and FMLA/state leave
    eligibility determination. The API eliminates manual data entry by connecting leave workflows between
    employer HR systems and Unum's leave management platform.
  humanURL: https://developer.unum.com/s/
  baseURL: https://api.unum.com
  tags:
  - Leave Management
  - FMLA
  - Absence Management
  - HR Integration
  properties:
